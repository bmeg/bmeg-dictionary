$schema: "http://json-schema.org/draft-04/schema#"

id: "file"
title: File
type: object
namespace: http://gdc.nci.nih.gov
program: '*'
project: '*'
category: data_file
description: >
  A file
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime

# required:
#   - submitter_id
  # - project_id
#   - md5
#   - file_id

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

links: []

properties:
  aliquot_submitter_id:
    type: string
  sample_id:
    type: string
  aliquots:
    $ref: _definitions.yaml#/to_many
  case_id:
    type: string
  data_format:
    type: string
  aliquot_id:
    type: string
  experimental_strategy:
    type: string
  file_id:
    type: string
  file_name:
    type: string
  file_size:
    type: integer
  md5:
    type: string
  path:
    type: string
  input_to:
    $ref: _definitions.yaml#/to_many
  created_by:
    $ref: _definitions.yaml#/to_one
  project_id:
    $ref: _definitions.yaml#/project_id
  submitter_id:
    type:
      - string
      - 'null'
  id:
    $ref: _definitions.yaml#/UUID
    systemAlias: node_id
  filecontents:
    type: string
  created_datetime:
    $ref: _definitions.yaml#/datetime
  updated_datetime:
    $ref: _definitions.yaml#/datetime
